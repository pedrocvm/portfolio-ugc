name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # o build avalia lib/supabase/config.ts, que exige as variáveis. Aqui não
      # se fala com a base: os valores só têm de existir e ser válidos.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
