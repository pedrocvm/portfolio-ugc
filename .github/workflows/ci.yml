name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  instagram-bridge-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/instagram-saves-bridge
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Compose configuration
        run: docker compose config --quiet
      - name: Build the server runtime with its real dependencies
        run: docker compose build --build-arg CAROLOS_SOURCE_REVISION="$GITHUB_SHA"
      - name: Verify imports and private persistent state without network
        run: bash verify-image.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Domínio puro e contratos da camada de IA. Os testes de integração
      # saltam-se sozinhos sem SUPABASE_TEST_*, e a avaliação com modelo real
      # corre à parte: uma chamada a um modelo por commit seria cara, lenta e
      # instável o suficiente para tornar o CI numa moeda ao ar.
      - run: npm run test
      # Contratos e recuperação do conector, sem login nem acesso ao Instagram.
      - run: python3 -m unittest discover -s tools/instagram-saves-bridge -p 'test_*.py'
      # o build avalia lib/supabase/config.ts, que exige as variáveis. Aqui não
      # se fala com a base: os valores só têm de existir e ser válidos.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          # Previews e CI nunca falam com o Gmail nem com o modelo de produção.
          CAROLOS_JOBS_ENABLED: 'false'
          CAROLOS_EXTERNAL_SEND_ENABLED: 'false'
